x-app: &app
  labels:
    logging: "promtail"
    logging_jobname: "containerlogs"
  tty: true
  stdin_open: true

services:
  gophermart-fake-orders:
    <<: *app
    container_name: gophermart-fake-orders
    build:
      context: ../
      dockerfile: .docker/Dockerfile
    environment:
      - LOG_LEVEL=-1
      - DATABASE_DSN=postgres://postgres:secret@gophermart_deploy-db-1:5432/gophermart_development
      - ACCRUAL_CREATE_GOODS_URL=http://accrual-accrual_service-1:8080/api/goods
      - GRPC_ADDRESS=0.0.0.0:8050
      - HTTP_ADDRESS=0.0.0.0:8060

networks:
  default:
    name: gophermart-network
